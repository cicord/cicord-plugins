# Signs index.yaml with the official key (CICORD_REGISTRY_SIGNING_KEY secret, the content of
# the file written by `cicord registry keygen`) and commits index.yaml.sig to main:
#   - after every change of index.yaml on main;
#   - weekly, so that the 30-day signature never lapses;
#   - on demand.
# It signs whatever index.yaml is on main: the protection of main (required reviews) is what
# decides what becomes official. Only main is ever signed, never a pull request.
name: sign
on:
  push:
    branches: [main]
    paths: [index.yaml]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sign
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'cicord/cicord-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: registry-signing
    steps:
      # The job that holds the signing key only builds a pinned Cicord release.
      - name: CICORD_VERSION is a release tag
        env:
          CICORD_VERSION: ${{ vars.CICORD_VERSION }}
        run: |
          if [[ ! "$CICORD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::set the CICORD_VERSION repository variable to a Cicord release tag (e.g. v0.2.0)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: ./.github/actions/setup-cicord
        with:
          version: ${{ vars.CICORD_VERSION }}
          token: ${{ secrets.CICORD_SOURCE_TOKEN || github.token }}
      - name: Sign index.yaml
        env:
          CICORD_REGISTRY_SIGNING_KEY: ${{ secrets.CICORD_REGISTRY_SIGNING_KEY }}
        run: |
          if [[ -z "$CICORD_REGISTRY_SIGNING_KEY" ]]; then
            echo "::error::the CICORD_REGISTRY_SIGNING_KEY secret is not set (see README.md, Maintainers)"
            exit 1
          fi
          cicord registry sign . --key env:CICORD_REGISTRY_SIGNING_KEY \
            --registry-url https://github.com/cicord/cicord-plugins
          bash scripts/verify.sh
      - name: Commit index.yaml.sig
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.yaml.sig
          git commit -m "chore(index): sign index.yaml"
          git push origin HEAD:main
