# Checks every plugin on pull requests and on main: SDK types, generated config types,
# build, simulator smoke test (`cicord plugin test`), type checks, unit tests; and that
# index.yaml can be signed and points at real plugin directories.
#
# Pull requests (community submissions included) run without any secret: never switch this
# workflow to pull_request_target. Actions are pinned to full commit SHAs (required by the
# repository settings), like in github.com/cicord/cicord.
name: plugins
on:
  pull_request:
  push:
    branches: [main, feature/0.2.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          echo "plugins=$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  plugin:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.list.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cicord
        with:
          version: ${{ (github.ref_name == 'feature/0.2.0' || github.base_ref == 'feature/0.2.0' || (github.head_ref == 'feature/0.2.0' && github.event.pull_request.head.repo.full_name == github.repository)) && '8c2f477fae8b5e3ec321c744353ea130e6e4d3f6' || vars.CICORD_VERSION || 'main' }}
          feature-build: ${{ github.ref_name == 'feature/0.2.0' || github.base_ref == 'feature/0.2.0' || (github.head_ref == 'feature/0.2.0' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check plugins/${{ matrix.plugin }}
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: bash scripts/check-plugin.sh "plugins/$PLUGIN"

  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cicord
        with:
          version: ${{ (github.ref_name == 'feature/0.2.0' || github.base_ref == 'feature/0.2.0' || (github.head_ref == 'feature/0.2.0' && github.event.pull_request.head.repo.full_name == github.repository)) && '8c2f477fae8b5e3ec321c744353ea130e6e4d3f6' || vars.CICORD_VERSION || 'main' }}
          feature-build: ${{ github.ref_name == 'feature/0.2.0' || github.base_ref == 'feature/0.2.0' || (github.head_ref == 'feature/0.2.0' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Check index.yaml
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == "pull_request" || "$REF_NAME" == "feature/0.2.0" ]]; then
            bash scripts/check-index.sh --allow-unlisted
          else
            bash scripts/check-index.sh
          fi
