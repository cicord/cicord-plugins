# Checks every plugin on pull requests and on main: SDK types, generated config types,
# build, simulator smoke test (`cicord plugin test`), type checks, unit tests; and that
# index.yaml can be signed and points at real plugin directories.
#
# Pull requests (community submissions included) run without any secret: never switch this
# workflow to pull_request_target. Actions are pinned to full commit SHAs (required by the
# repository settings), like in github.com/cicord/cicord.
name: plugins
on:
  pull_request:
  push:
    branches: [main, feature/0.2.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      core-ref: ${{ (github.ref_name == 'feature/0.2.0' || github.base_ref == 'feature/0.2.0' || (github.head_ref == 'feature/0.2.0' && github.event.pull_request.head.repo.full_name == github.repository)) && 'e1aca42c8d0d1e7cd119b5d096414bcb77f6e974' || vars.CICORD_VERSION || 'main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          echo "plugins=$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  plugin:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.list.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cicord
        with:
          version: ${{ needs.list.outputs.core-ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check plugins/${{ matrix.plugin }}
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: bash scripts/check-plugin.sh "plugins/$PLUGIN"

  index:
    needs: list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cicord
        with:
          version: ${{ needs.list.outputs.core-ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify disabled installations without grants
        run: node --test scripts/disabled-instances.test.mjs
      - name: Check index.yaml
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == "pull_request" || "$REF_NAME" == "feature/0.2.0" ]]; then
            bash scripts/check-index.sh --allow-unlisted
          else
            bash scripts/check-index.sh
          fi

  persistence:
    needs: list
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The mixed-version fixture reads the immutable, published levels 0.1.0 source.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cicord/cicord
          ref: ${{ needs.list.outputs.core-ref }}
          path: .cicord-src
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: .cicord-src/go.mod
          cache-dependency-path: .cicord-src/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Verify published migrations on SQLite and PostgreSQL
        env:
          CICORD_SOURCE: ${{ github.workspace }}/.cicord-src
          CICORD_TEST_POSTGRES_URL: postgres://postgres:ci-only@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          for test in plugins/*/test/persistence/run.mjs; do
            node "$test"
          done
      - name: Verify mixed-version poll rewards across a runtime restart
        env:
          CICORD_SOURCE: ${{ github.workspace }}/.cicord-src
          GOMAXPROCS: 2
        run: node scripts/interop/run.mjs
