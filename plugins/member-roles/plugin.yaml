apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: member-roles
  version: 0.1.0
  displayName: Member roles
  description: Timed grants, sticky roles, membership milestones and booster benefits.
  license: Apache-2.0
  keywords: [roles, membership, boosts]
spec:
  engine: ">=0.2.0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  intents:
    - ServerMembers # Observe member joins, departures and role changes.
  capabilities:
    - discord.roles.assign # Add or remove the configured roles for eligible members.
    - discord.members.read # Resolve current members, roles and eligibility.
    - storage.kv # Persist installation state and progress across restarts.
    - scheduler # Run delayed work and recover it after restart.
    - events.publish # Deliver declared events to authorized subscribers.
  optional:
    - feature: boostAnnouncements
      capabilities:
        - discord.channels.read # Resolve configured channels and their current permissions.
        - discord.messages.send # Post this installation’s Discord messages.
  interop:
    types: ./src/contracts.ts
    publishes: [{topic: tempRoleExpired, version: 1, scope: server}]
    provides: {actions: [grantTemporary, revoke]}
  privacy:
    records:
      - {name: memberRoles, policy: erase, description: "Sticky-role snapshots, boost state and the request token of temporary grants keyed by member."}
      - {name: activeTemporaryGrants, policy: retain, description: "Member, role and deadline of a live temporary grant, with its expiry task.", retention: "Until the grant expires", justification: "A data request must not turn a timed role or restriction into a permanent one; the expiry task removes the role on schedule."}
      - {name: roleJobs, policy: erase, description: "The current tenure pagination cursor when it names the member."}
