# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: audit-log
  version: 0.2.0
  displayName: Audit log
  description: Staff-only audit observations with evidence-based attribution and thirty-day search. Optional MessageContent access caches message text for up to seven days.
  license: Apache-2.0
  keywords: [audit, logs, moderation, staff, events]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - discord.messages.send # post observations and edit the bot's own log copies
    - discord.messages.read # find existing deliveries and retract bot-owned copies
    - discord.channels.read # check source and destination audiences
    - discord.auditlog.read # authoritative actor and permission-change evidence
    - storage.kv # durable outbox, correlation, retention and privacy records
    - scheduler # attribution deadlines, migrations, retry and retention
    - portal.routes # moderator search and export
  intents:
    - ServerMembers # Observe member joins, departures and role changes.
    - ServerMessages # Receive message events in guild channels.
    - ServerModeration # Receive guild moderation events for audit correlation.
    - ServerInvites # Observe changes to guild invitations.
    - ServerVoiceStates # Observe members joining, moving and leaving voice rooms.
    - ServerExpressions # Observe emoji and other guild expression changes.
    - AutoModerationExecution # Observe the action actually taken by Discord AutoMod.
  optional:
    - feature: cacheContent
      when: /cacheContent
      intents:
        - MessageContent # Read the contents required by the configured message handler.
    - feature: search
      capabilities:
        - storage.index # Index and search scoped source material.
    - feature: partners
      capabilities:
        - events.subscribe # Receive the events declared in the interop section.
  config: {schema: ./config.schema.json}
  locales: ./locales
  routes: {types: ./src/routes.ts}
  delivery: at-least-once
  interop:
    types: ./src/contracts.ts
    subscribes:
      - {topic: moderation.case, version: 2}
      - moderation.caseUpdated
      - moderation.appeal
      - {topic: polls.closed, version: 2}
      - levels.levelUp
      - guard.violation
      - guard.raid
      - anti-nuke.triggered
      - verification.passed
      - verification.failed
      - tickets.opened
      - tickets.closed
      - giveaways.started
      - giveaways.ended
      - economy.transaction
      - member-roles.tempRoleExpired
  privacy:
    records:
      - {name: observation, policy: erase, description: "Observations naming the member, pending batch entries, search documents and lines in bot-authored copies.", retention: "1–30 days, configured by retentionDays."}
      - {name: shared-observation, policy: anonymize, description: "Remove the subject from multi-member observations, discard free text, and redact the corresponding index and Discord copy.", retention: "1–30 days."}
      - {name: attribution, policy: erase, description: "Short-lived audit evidence, observed authors and unresolved deletions.", retention: "Evidence for 90 seconds; author metadata for up to seven days."}
      - {name: message-content, policy: erase, description: "Opt-in excerpts from non-ignored channels. Search hits require current access to the source and staff log.", retention: "Up to seven days, or the configured shorter retention."}
