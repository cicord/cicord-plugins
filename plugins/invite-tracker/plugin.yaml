apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: invite-tracker
  version: 0.1.0
  displayName: Invite tracker
  description: Track server invitations, attribute joins and rank valid invitations.
  license: Apache-2.0
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  capabilities:
    - discord.invites.read # Compare invite counters to attribute joins when possible.
    - scheduler # resumable invite count and leaderboard index migration
    - storage.kv # Persist installation state and progress across restarts.
    - events.publish # Deliver declared events to authorized subscribers.
    - portal.routes # Serve the access-controlled routes declared below.
  intents:
    - ServerMembers # Observe member joins, departures and role changes.
    - ServerInvites # Observe changes to guild invitations.
  interop:
    types: ./src/contracts.ts
    publishes: [{topic: joined, version: 1, scope: server}]
    provides: {queries: [inviterOf, count]}
  privacy:
    records:
      - {name: members, policy: erase, description: "Inviter, invitee, join date and attribution records."}
  routes: {types: ./src/routes.ts}
