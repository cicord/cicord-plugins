apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: invite-tracker
  version: 0.1.0
  displayName: Invite tracker
  description: Track server invitations, attribute joins and rank valid invitations.
  license: Apache-2.0
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  capabilities:
    - discord.invites.read
    - scheduler # resumable invite count and leaderboard index migration
    - storage.kv
    - events.publish
    - portal.routes
  intents: [ServerMembers, ServerInvites]
  interop:
    types: ./src/contracts.ts
    publishes: [{topic: joined, version: 1, scope: server}]
    provides: {queries: [inviterOf, count]}
  privacy:
    records:
      - {name: members, policy: erase, description: "Inviter, invitee, join date and attribution records."}
  routes: {types: ./src/routes.ts}
