# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: tickets
  version: 0.4.0
  displayName: Tickets
  description: Private support queues with per-type forms and staff, portal replies and notes, retained transcripts and member-selected modmail.
  license: Apache-2.0
  keywords: [tickets, support, helpdesk, portal]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - discord.messages.send     # panel, welcome message, notices, portal replies, log summary
    - discord.messages.read     # summary (participants, count); last 50 messages for the staff portal
    - discord.channels.read # Resolve configured channels and their current permissions.
    - discord.channels.manage   # ticket channels (plugin-owned)
    - discord.members.read      # check that an assignee is staff; GET /staff lists the staff roles' members
    - storage.kv # Persist installation state and progress across restarts.
    - portal.routes             # member and staff routes (src/routes.ts)
    - discord.messages.manage # Moderate or maintain the messages controlled by this feature.
    - discord.dm.send # Relay staff replies to the authorized ticket opener and retract managed copies.
    - events.publish # Deliver declared events to authorized subscribers.
    - scheduler # Run delayed work and recover it after restart.
    - portal.links # Issue links to this installation’s portal flows.
  intents:
    - ServerMessages # Receive message events in guild channels.
    - MessageContent # Read the conversation for transcripts and consented modmail relay.
    - ServerMembers # Observe member joins, departures and role changes.
    - DirectMessages # Receive messages sent directly to the bot.
  locales: ./locales
  delivery: at-least-once
  optional:
    - feature: messageContextMenu
      capabilities:
        - discord.channels.read # Resolve configured channels and their current permissions.
    - feature: appealUpdates
      capabilities:
        - events.subscribe # Receive the events declared in the interop section.
    - feature: onDuty
      capabilities:
        - plugins.query:staff-shifts.onDuty # Read staff-shifts.onDuty from the explicitly bound provider.
    - feature: caseContext
      capabilities:
        - plugins.query:moderation.cases # Read moderation.cases from the explicitly bound provider.
  interop:
    publishes:
      - {topic: opened, version: 1, scope: server}
      - {topic: closed, version: 1, scope: server}
      - {topic: rated, version: 1, scope: server}
    subscribes: [{topic: moderation.appeal, version: 1}]
    provides: { queries: [openFor], actions: [open] }
    consumes: { queries: [staff-shifts.onDuty, moderation.cases] }
  privacy:
    records:
      - {name: tickets, policy: anonymize, description: Ticket participants and their authored content including staff notes and portal responses., retention: While open and 1 to 730 days after closing.}
      - {name: transcripts, policy: anonymize, description: Authored transcript lines and tracked Discord copies., retention: Configurable between 1 and 365 days.}
      - {name: relays, policy: erase, description: Pending private texts and durable receipts for bot-authored copies.}
      - {name: indexes, policy: erase, description: Member lookup keys and open-ticket indexes.}
  config:
    schema: ./config.schema.json
  routes:
    types: ./src/routes.ts
