# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: polls
  version: 0.2.0
  displayName: Polls
  description: Quick polls with buttons or a select menu, live results, automatic closing and an optional discussion thread. Publishes polls.closed for other plugins.
  license: Apache-2.0
  keywords: [polls, votes, community, events]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - discord.messages.send     # the poll message
    - discord.messages.read     # find the poll message again when it closes on its own
    - discord.channels.read # Resolve configured channels and their current permissions.
    - discord.threads.manage    # optional discussion thread
    - discord.members.read       # check delegated voters queries
    - storage.kv # Persist installation state and progress across restarts.
    - scheduler                 # automatic closing
    - events.publish            # polls.closed
    - portal.routes             # GET /polls/:id
  delivery: at-least-once
  privacy:
    records:
      - {name: ballots, policy: erase, description: "Remove ballots, membership of voter pages and poll authorship on request."}
  locales: ./locales
  interop:
    types: ./src/contracts.ts
    publishes:
      - {topic: closed, version: 1, scope: bot}
      - {topic: closed, version: 2, scope: server}
    provides: {queries: [voters]}
  config:
    schema: ./config.schema.json
  routes:
    types: ./src/routes.ts       # portal contract (cicord portal typegen)
