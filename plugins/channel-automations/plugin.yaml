apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: channel-automations
  version: 0.1.0
  displayName: Channel automations
  description: Per-channel thread, reaction, publication, media and cleanup rules.
  license: Apache-2.0
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - storage.kv # persist plugin state
    - scheduler # durable timers and periodic work
    - discord.channels.read # resolve destination channels
    - discord.messages.read # re-read original messages
  intents:
    - ServerMessages # Receive message events in guild channels.
  optional:
    - feature: threads
      capabilities:
        - discord.threads.manage # Open or maintain the relevant discussion thread.
    - feature: reactions
      capabilities:
        - discord.reactions.manage # Read or update reaction state on the configured panel.
    - feature: crosspost
      capabilities:
        - discord.messages.send # Post this installation’s Discord messages.
    - feature: cleanup
      capabilities:
        - discord.messages.manage # Moderate or maintain the messages controlled by this feature.
    - feature: mediaOnly
      capabilities:
        - discord.messages.manage # Moderate or maintain the messages controlled by this feature.
        - discord.dm.send # Send the private member notification.
        - discord.members.read # Resolve current members, roles and eligibility.
      intents:
        - MessageContent # Read the contents required by the configured message handler.
  config:
    schema: ./config.schema.json
  interop: {}
  delivery: at-least-once
  locales: ./locales
  privacy:
    records:
      - name: members
        policy: erase
        description: Rate limits and pending cleanup for authored messages.
