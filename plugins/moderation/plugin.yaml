# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: moderation
  version: 0.3.0
  displayName: Moderation
  description: Staff moderation with warnings, expiring bans, reviewed message purges, case history and private notes.
  license: Apache-2.0
  keywords: [moderation, warnings, audit, automod]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  locales: ./locales
  delivery: at-least-once
  privacy:
    records:
      - {name: cases, policy: retain, description: Redact identities and free text in closed cases., retention: "365 days", justification: "Staff need a bounded record of prior enforcement."}
      - {name: active-sanctions, policy: retain, description: Minimum subject and expiry generation for live sanctions., retention: Until lifted or expired, justification: "A data request must not bypass a current ban or quarantine."}
      - {name: private-notes, policy: erase, description: Erase private notes on a member request.}
      - {name: appeals, policy: erase, description: Erase appeal statements and case access.}
      - {name: warnings-indexes-and-statistics, policy: erase, description: Erase the subject's warning and history indexes and staff totals.}
  optional:
    - {feature: legacyFlood, capabilities: [discord.messages.manage]}
    - {feature: legacyMemberLog, capabilities: [discord.messages.send]}
    - {feature: lock, capabilities: [server.overlays]}
    - {feature: quarantine, capabilities: [discord.roles.assign]}
    - {feature: appeals, capabilities: [portal.links]}
    - {feature: appealsViaTicket, capabilities: ["plugins.call:tickets.open"]}
  interop:
    types: ./src/contracts.ts
    publishes:
      - {topic: case, scope: server, version: 1}
      - {topic: case, scope: server, version: 2}
      - {topic: caseUpdated, scope: server, version: 1}
      - {topic: appeal, scope: server, version: 1}
    provides: {queries: [standing, cases], actions: [sanction]}
    consumes: {actions: [tickets.open]}
  capabilities:
    - discord.auditlog.read      # bind ban release to the issuing audit entry
    - discord.messages.send      # audit log
    - discord.messages.manage    # delete flood messages
    - scheduler                  # persistent temporary-ban expiry
    - discord.messages.read      # preview and filter the messages to purge
    - discord.channels.read
    - discord.members.read
    - discord.members.moderate   # timeout, kick, ban
    - discord.dm.send            # tell the member why
    - storage.kv                 # warnings (expiring), case numbers
    - http.fetch                 # optional webhook
    - portal.routes              # warnings for the staff portal
    - events.publish             # moderation.case, for the audit log
  # ServerMembers: join/leave/update log. ServerMessages: flood protection, which only needs
  # who posts and when, never the content (no MessageContent).
  intents: [ServerMembers, ServerMessages, ServerModeration]
  secrets:
    - name: WEBHOOK_URL
      description: Discord or Slack webhook URL for moderation notices
      required: false
      hosts: [discord.com, hooks.slack.com]
  network:
    allow: [hooks.slack.com, discord.com]
  config:
    schema: ./config.schema.json
