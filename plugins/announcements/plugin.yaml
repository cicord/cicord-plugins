# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: announcements
  version: 0.2.0
  displayName: Scheduled announcements
  description: Recurring or one-off announcements from the config (cron, interval or date, in your time zone), and /announce for moderators to schedule, list and cancel their own. Mentions ping only who you say.
  license: Apache-2.0
  keywords: [announcements, schedule, reminders, cron, events]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - storage.kv # persist plugin state
    - scheduler # durable timers and periodic work
    - discord.channels.read # resolve destination channels
    - discord.messages.send # post configured messages
    - portal.routes # serve access-controlled forms
  optional:
    - feature: crosspost
      capabilities: # report Discord publication failures in instance health
        - discord.messages.send # Post this installation’s Discord messages.
    - feature: recoverPosts
      capabilities:
        - discord.messages.read # Read the source messages used by this installation.
    - feature: stickies
      capabilities:
        - discord.messages.read # Read the source messages used by this installation.
        - discord.messages.manage # Moderate or maintain the messages controlled by this feature.
      intents:
        - ServerMessages # Receive message events in guild channels.
    - feature: countdowns
      capabilities:
        - discord.messages.read # Read the source messages used by this installation.
  config:
    schema: ./config.schema.json
  interop: {}
  delivery: at-least-once
  locales: ./locales
  privacy:
    records:
      - name: members
        policy: erase
        description: Pending messages authored by or mentioning the member.
  routes:
    types: ./src/routes.ts
