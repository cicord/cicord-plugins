apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: verification
  version: 0.2.0
  displayName: Verification
  description: Member-bound challenges, age checks and a staff approval queue. Role assignment uses the existing server permission policy.
  license: Apache-2.0
spec:
  engine: ">=0.2.0"
  entry: ./src/index.ts
  locales: ./locales
  capabilities:
    - discord.channels.read # Resolve configured channels and their current permissions.
    - discord.messages.read # Read the source messages used by this installation.
    - discord.messages.send # Post this installation’s Discord messages.
    - discord.members.read # Resolve current members, roles and eligibility.
    - discord.roles.assign # Add or remove the configured roles for eligible members.
    - storage.kv # Persist installation state and progress across restarts.
    - scheduler # Run delayed work and recover it after restart.
    - portal.routes # Serve the access-controlled routes declared below.
    - portal.links # Issue links to this installation’s portal flows.
    - events.publish # Deliver declared events to authorized subscribers.
  intents:
    - ServerMembers # Observe member joins, departures and role changes.
  optional:
    - feature: captcha
      capabilities:
        - http.fetch # Contact the reviewed service using the manifest’s network policy.
    - feature: visual
      capabilities:
        - render # Generate the configured image card from bundled assets.
    - feature: dm
      capabilities:
        - discord.dm.send # Send the private member notification.
    - feature: directKick
      capabilities:
        - discord.members.moderate # Apply the configured sanction after checking target eligibility.
    - feature: sanctions
      capabilities:
        - plugins.call:moderation.sanction # Invoke moderation.sanction on the explicitly bound provider.
  config:
    schema: ./config.schema.json
  routes:
    types: ./src/routes.ts
  delivery: at-least-once
  interop:
    types: ./src/contracts.ts
    publishes:
      - { topic: passed, scope: server, version: 1 }
      - { topic: failed, scope: server, version: 1 }
    provides:
      queries: [status]
    consumes:
      actions: [moderation.sanction]
  network:
    allow: [challenges.cloudflare.com, api.hcaptcha.com]
  secrets:
    - name: TURNSTILE_SECRET
      description: Turnstile verification secret
      required: false
      hosts: [challenges.cloudflare.com]
    - name: HCAPTCHA_SECRET
      description: hCaptcha verification secret
      required: false
      hosts: [api.hcaptcha.com]
  privacy:
    records:
      - name: verification
        policy: erase
        description: Result, method and decision time.
        retention: 30 days
      - name: pending
        policy: erase
        description: Join and review state, failure counters (15 minutes and one day) and transient challenge.
        retention: 30 days
