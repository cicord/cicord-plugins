# yaml-language-server: $schema=https://raw.githubusercontent.com/cicord/cicord/main/spec/schemas/plugin.schema.json
apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: welcome
  version: 0.2.0
  displayName: Welcome
  description: Greets new members, gives them a default role and sends an onboarding link.
  license: Apache-2.0
  keywords: [welcome, onboarding]
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  capabilities:
    - storage.kv # persist plugin state
    - discord.messages.send # post configured messages
    - discord.members.read # resolve members at delivery
    - discord.channels.read # resolve destination channels
  intents:
    - ServerMembers # Observe member joins, departures and role changes.
  optional:
    - feature: onboarding
      capabilities:
        - discord.dm.send # Send the private member notification.
        - portal.links # Issue links to this installation’s portal flows.
    - feature: defaultRole
      capabilities:
        - discord.roles.assign # Add or remove the configured roles for eligible members.
    - feature: verified
      capabilities:
        - events.subscribe # Receive the events declared in the interop section.
    - feature: inviter
      capabilities:
        - plugins.query:invite-tracker.inviterOf # Read invite-tracker.inviterOf from the explicitly bound provider.
    - feature: cards
      capabilities:
        - render # Generate the configured image card from bundled assets.
    - feature: templates
      capabilities:
        - files.read # Read the versioned files bound to this installation.
  interop:
    types: ./src/contracts.ts
    subscribes: [{ topic: verification.passed, version: 1 }]
    consumes: { queries: [invite-tracker.inviterOf] }
  config:
    schema: ./config.schema.json
  delivery: at-least-once
  locales: ./locales
  privacy:
    records:
      - name: members
        policy: erase
        description: Greeting receipt and member number for the current membership.
  assets: ./assets
