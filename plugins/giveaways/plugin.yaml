apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: giveaways
  version: 0.1.0
  displayName: Giveaways
  description: "Experimental, opt-in: auditable weighted community giveaways with scheduled draws and claims."
  license: Apache-2.0
spec:
  engine: ">=0.2.0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  capabilities:
    - discord.messages.send # publish and refresh the draw message
    - discord.messages.read # recover the original announcement
    - discord.channels.read # resolve contest channels
    - discord.members.read # verify entrants and deliver prizes
    - discord.dm.send # notify the selected members
    - storage.kv # entries, commitment and draw history
    - scheduler # close, refresh and expire claims
    - portal.routes # public verifier and staff list
    - events.publish # started and ended
  optional:
    - feature: level
      capabilities:
        - plugins.query:levels.memberLevel # Read levels.memberLevel from the explicitly bound provider.
    - feature: invites
      capabilities:
        - plugins.query:invite-tracker.count # Read invite-tracker.count from the explicitly bound provider.
    - feature: standing
      capabilities:
        - plugins.query:moderation.standing # Read moderation.standing from the explicitly bound provider.
    - feature: xpReward
      capabilities:
        - plugins.call:levels.grantXp # Invoke levels.grantXp on the explicitly bound provider.
    - feature: coinReward
      capabilities:
        - plugins.call:economy.credit # Invoke economy.credit on the explicitly bound provider.
    - feature: roleReward
      capabilities:
        - plugins.call:member-roles.grantTemporary # Invoke member-roles.grantTemporary on the explicitly bound provider.
  interop:
    types: ./src/contracts.ts
    publishes:
      - {topic: started, version: 1, scope: server}
      - {topic: ended, version: 1, scope: server}
    consumes:
      queries: [levels.memberLevel, invite-tracker.count, moderation.standing]
      actions: [levels.grantXp, economy.credit, member-roles.grantTemporary]
  privacy:
    records:
      - {name: entrants, policy: erase, description: "Entry weights and winner or claim identities in the archived draw."}
  routes: {types: ./src/routes.ts}
