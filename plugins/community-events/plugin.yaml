apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: community-events
  version: 0.1.0
  displayName: Community events
  description: Recurring Discord events, attendance and opt-in reminders with a public calendar feed.
  license: Apache-2.0
spec:
  engine: ">=0.2.0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  capabilities:
    - discord.events.read # Read event details and attendance.
    - discord.events.manage # Create and edit the scheduled events this installation manages.
    - discord.members.read # Resolve current members, roles and eligibility.
    - discord.channels.read # Resolve configured channels and their current permissions.
    - discord.messages.send # Post this installation’s Discord messages.
    - discord.dm.send # Send the private member notification.
    - scheduler # Run delayed work and recover it after restart.
    - storage.kv # Persist installation state and progress across restarts.
    - portal.routes # Serve the access-controlled routes declared below.
    - events.publish # Deliver declared events to authorized subscribers.
  intents:
    - ServerScheduledEvents # Receive scheduled event changes and attendance updates.
    - ServerVoiceStates # Observe members joining, moving and leaving voice rooms.
  interop:
    types: ./src/contracts.ts
    publishes: [{topic: started, version: 1, scope: server}, {topic: ended, version: 1, scope: server}]
  privacy:
    records:
      - {name: members, policy: erase, description: "Attendance and reminder subscription records."}
  routes: {types: ./src/routes.ts}
