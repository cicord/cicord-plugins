apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: anti-nuke
  version: 0.2.0
  displayName: Anti-nuke
  description: Monitor administrative changes using audit evidence. Staff can inspect uncertain, delayed and confirmed observations.
  license: Apache-2.0
spec:
  engine: ">=0.2.0-0"
  entry: ./src/index.ts
  locales: ./locales
  capabilities:
    - discord.auditlog.read # Associate structural changes with audit actors before alerting staff.
    - discord.channels.read # Resolve configured channels and their current permissions.
    - discord.messages.read # Read the source messages used by this installation.
    - discord.messages.send # Post monitor-mode alerts in the private staff channel.
    - discord.members.read # Resolve current members, roles and eligibility.
    - storage.kv # Persist installation state and progress across restarts.
    - scheduler # Run delayed work and recover it after restart.
    - portal.routes # Serve the access-controlled routes declared below.
    - events.subscribe # Receive the events declared in the interop section.
    - events.publish # Deliver declared events to authorized subscribers.
  intents:
    - ServerModeration # Receive guild moderation events for audit correlation.
  optional:
    - feature: ownerDM
      capabilities:
        - discord.dm.send # Send the private member notification.
    - feature: webhook
      capabilities:
        - http.fetch # Post a staff notification using the send-only webhook binding.
  network:
    allow: [discord.com]
  secrets:
    - name: WEBHOOK_URL
      use: webhook.send
      required: false
      hosts: [discord.com]
      description: Staff notification webhook URL
  config:
    schema: ./config.schema.json
  routes:
    types: ./src/routes.ts
  delivery: at-least-once
  interop:
    types: ./src/contracts.ts
    publishes:
      - { topic: triggered, scope: server, version: 1 }
    subscribes:
      - { topic: guard.raid, version: 1 }
  privacy:
    records:
      - name: evidence
        policy: erase
        description: Time-limited audit observations and actor counters.
        retention: 30 days
      - name: command trust
        policy: erase
        description: Owner-managed temporary trusted identity.
        retention: 30 days
