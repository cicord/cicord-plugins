apiVersion: cicord.dev/v1alpha1
kind: Plugin
metadata:
  name: economy
  version: 0.1.0
  displayName: Economy
  description: "Experimental, opt-in: server points, daily claims, transfers and a community rewards shop."
  license: Apache-2.0
spec:
  engine: ">=0.2.0"
  entry: ./src/index.ts
  config: {schema: ./config.schema.json}
  locales: ./locales
  delivery: at-least-once
  capabilities:
    - storage.kv # balances, journal, idempotency receipts and orders
    - discord.messages.send # wallet and shop commands
    - portal.routes # member wallets and staff ledger
    - events.publish # financial journal notifications
    - scheduler # shop delivery retries and refunds, poll batches
  optional:
    - feature: eventRewards
      capabilities:
        - events.subscribe # Receive the events declared in the interop section.
    - feature: pollPages
      capabilities:
        - plugins.query:polls.voters # Read polls.voters from the explicitly bound provider.
    - feature: permanentRole
      capabilities:
        - discord.roles.assign # Add or remove the configured roles for eligible members.
        - discord.members.read # Resolve current members, roles and eligibility.
    - feature: temporaryRole
      capabilities:
        - plugins.call:member-roles.grantTemporary # Invoke member-roles.grantTemporary on the explicitly bound provider.
    - feature: perk
      capabilities:
        - plugins.call:tickets.open # Invoke tickets.open on the explicitly bound provider.
    - feature: messageRewards
      intents:
        - ServerMessages # Receive message events in guild channels.
    - feature: voiceRewards
      intents:
        - ServerVoiceStates # Observe members joining, moving and leaving voice rooms.
      capabilities:
        - discord.members.read # Resolve current members, roles and eligibility.
        - discord.channels.read # Resolve configured channels and their current permissions.
  interop:
    types: ./src/contracts.ts
    publishes:
      - {topic: transaction, version: 1, scope: server}
    subscribes:
      - {topic: levels.levelUp, version: 1}
      - {topic: polls.closed, version: 2}
      - {topic: suggestions.statusChanged, version: 1}
      - {topic: starboard.starred, version: 1}
      - {topic: birthdays.today, version: 1}
      - {topic: community-events.ended, version: 1}
      - {topic: tickets.closed, version: 1}
    provides:
      queries: [balance]
      actions: [credit, debit]
    consumes:
      queries: [polls.voters]
      actions: [member-roles.grantTemporary, tickets.open]
  privacy:
    records:
      - {name: accounts, policy: erase, description: "Balances, claims, earnings, orders, the pending-order index and journal rows attributable to a member. Idempotency receipts are keyed by a digest, hold only a timestamp and are kept."}
  routes: {types: ./src/routes.ts}
